minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [pre-commit, pre-push]
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: project-checks
        name: Required code and architecture checks
        entry: just check
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
        stages: [pre-commit, pre-push]
      - id: diagnostic-cleanup
        name: Remove disposable diagnostic logs
        entry: uv run --locked --no-sync python -m tools.code_quality.cleanup
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
        stages: [pre-commit, pre-push]
