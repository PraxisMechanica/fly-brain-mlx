minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: project-checks
        name: Required code and architecture checks
        entry: just check
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
        stages: [pre-commit, pre-push]
