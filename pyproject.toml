[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "fly-brain"
version = "0.1.0"
description = "Validated Apple MLX fly-brain numerical core"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mlx==0.32.3",
    "mlx-metal==0.32.3",
    "numpy==1.26.4",
    "pyarrow==25.0.1",
    "pydantic>=2.11,<3",
]

[project.scripts]
fly-brain = "fly_brain.cli:main"

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "import-linter>=2.3,<3",
    "radon==6.0.1",
    "pre-commit==3.2.2",
]
qualification = [
    "brian2==2.8.0",
    "cython==3.3.0",
    "torch==2.11.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.hatch.build.targets.wheel]
packages = ["src/fly_brain"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["docs/evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["src", "tests", "tools", "main.py"]
exclude = [".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-m", "not checker"]
markers = [
    "checker: source/compiler/hook exercises selected explicitly for relevant changes",
    "unit: deterministic tests without a device or reference framework",
    "integration: real file, reference, or process boundary checks",
    "reference: independent Brian2 and CPU PyTorch contract checks",
    "metal: qualification on a real Apple Metal device",
]

[tool.importlinter]
root_package = "fly_brain"
include_external_packages = true
contract_types = ["neutral_imports: tools.architecture.neutral_import_contract.NeutralImportContract"]

[[tool.importlinter.contracts]]
name = "Scientific calculations avoid workflow and storage dependencies"
type = "forbidden"
source_modules = [
    "fly_brain.simulation.mapping",
    "fly_brain.simulation.experiments",
    "fly_brain.simulation.stimuli",
    "fly_brain.qualification.reference_parameters",
    "fly_brain.qualification.matrix",
    "fly_brain.qualification.matrix_diagnostics",
    "fly_brain.qualification.input_patterns",
    "fly_brain.qualification.fan_in",
    "fly_brain.qualification.causality",
    "fly_brain.qualification.adjudication",
    "fly_brain.qualification.rounding_review",
    "fly_brain.qualification.batch_evidence",
    "fly_brain.qualification.batch_identity",
    "fly_brain.comparison.acceptance",
    "fly_brain.comparison.diagnostics",
    "fly_brain.comparison.pooling",
    "fly_brain.comparison.metrics",
]
forbidden_modules = [
    "fly_brain.cli",
    "fly_brain.bootstrap",
    "fly_brain.infrastructure.seeded_random",
    "fly_brain.simulation.inputs",
    "fly_brain.simulation.storage",
    "fly_brain.qualification.adapters",
    "fly_brain.comparison.storage",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "MLX simulation has no reference or comparison framework"
type = "forbidden"
source_modules = ["fly_brain.simulation"]
forbidden_modules = ["fly_brain.qualification", "fly_brain.comparison", "brian2", "torch"]

[[tool.importlinter.contracts]]
name = "Spike comparison has no execution framework"
type = "neutral_imports"
source_root = "fly_brain.comparison"
foreign_roots = ["fly_brain.simulation", "fly_brain.qualification", "mlx", "brian2", "torch"]
neutral_modules = ["fly_brain.simulation.identifiers"]

[[tool.importlinter.contracts]]
name = "Comparison calculations avoid orchestration and storage"
type = "forbidden"
source_modules = [
    "fly_brain.comparison.acceptance",
    "fly_brain.comparison.diagnostics",
    "fly_brain.comparison.metrics",
    "fly_brain.comparison.pooling",
]
forbidden_modules = [
    "fly_brain.comparison.reporting",
    "fly_brain.comparison.commands",
    "fly_brain.comparison.module",
    "fly_brain.comparison.service",
    "fly_brain.comparison.schemas",
    "fly_brain.comparison.storage",
]

[[tool.importlinter.contracts]]
name = "Active qualification uses injected observation sessions"
type = "forbidden"
source_modules = [
    "fly_brain.qualification.adapters.paired_collect",
    "fly_brain.qualification.adapters.mlx_batch_collect",
    "fly_brain.qualification.adapters.case_execution",
    "fly_brain.qualification.adapters.paired_observer",
    "fly_brain.qualification.adapters.paired_causes",
    "fly_brain.qualification.adapters.parity_case",
]
forbidden_modules = [
    "fly_brain.simulation.backend",
    "fly_brain.simulation.observation_module",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "PyTorch reference uses injected connectome silencing"
type = "forbidden"
source_modules = [
    "fly_brain.qualification.adapters.torch_setup",
    "fly_brain.qualification.adapters.parity_case",
]
forbidden_modules = [
    "fly_brain.simulation.mapping",
    "fly_brain.simulation.input_service",
    "fly_brain.simulation.module",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Parity uses owned stimulus services"
type = "forbidden"
source_modules = [
    "fly_brain.qualification.service",
    "fly_brain.qualification.adapters.parity_case",
    "fly_brain.qualification.adapters.case_report",
]
forbidden_modules = [
    "fly_brain.simulation.experiments",
    "fly_brain.simulation.stimuli",
    "fly_brain.simulation.storage",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Input audit uses owned mapping services"
type = "forbidden"
source_modules = ["fly_brain.qualification.input_audit_service"]
forbidden_modules = [
    "fly_brain.simulation.mapping",
    "fly_brain.simulation.input_service",
    "fly_brain.simulation.module",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Host input audit uses injected file storage"
type = "forbidden"
source_modules = [
    "fly_brain.qualification.input_audit_service",
    "fly_brain.qualification.input_audit_rules",
]
forbidden_modules = ["fly_brain.qualification.adapters.connectome_probe"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Fan-in analysis uses owned mapping services"
type = "forbidden"
source_modules = [
    "fly_brain.qualification.input_patterns",
    "fly_brain.qualification.adapters.fan_in_probe",
]
forbidden_modules = [
    "fly_brain.simulation.mapping",
    "fly_brain.simulation.input_service",
    "fly_brain.simulation.module",
]
allow_indirect_imports = false
